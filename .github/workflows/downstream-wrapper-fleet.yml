name: downstream wrapper fleet contract

on:
  pull_request:
    paths:
      - 'operations/downstream-wrapper-fleet.v1.json'
      - 'scripts/check-downstream-wrapper-fleet.py'
      - 'suite/operations/test_downstream_wrapper_fleet.py'
      - '.github/workflows/downstream-wrapper-fleet.yml'
  push:
    branches:
      - main
    paths:
      - 'operations/downstream-wrapper-fleet.v1.json'
      - 'scripts/check-downstream-wrapper-fleet.py'
      - 'suite/operations/test_downstream_wrapper_fleet.py'
      - '.github/workflows/downstream-wrapper-fleet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate 17 wrappers and 17 existing E2E repositories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout inventory controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compile validator and run adversarial unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/check-downstream-wrapper-fleet.py
          python3 -m unittest suite.operations.test_downstream_wrapper_fleet -v

      - name: Render deterministic JSON and Markdown dashboards twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fleet-a" "$RUNNER_TEMP/fleet-b" dashboard
          for root in "$RUNNER_TEMP/fleet-a" "$RUNNER_TEMP/fleet-b"; do
            python3 scripts/check-downstream-wrapper-fleet.py \
              --format json \
              --output "$root/downstream-wrapper-fleet.json"
            python3 scripts/check-downstream-wrapper-fleet.py \
              --format markdown \
              --output "$root/downstream-wrapper-fleet.md"
          done
          cmp "$RUNNER_TEMP/fleet-a/downstream-wrapper-fleet.json" \
              "$RUNNER_TEMP/fleet-b/downstream-wrapper-fleet.json"
          cmp "$RUNNER_TEMP/fleet-a/downstream-wrapper-fleet.md" \
              "$RUNNER_TEMP/fleet-b/downstream-wrapper-fleet.md"
          cp "$RUNNER_TEMP/fleet-a"/* dashboard/
          grep -F 'Wrappers: **17**' dashboard/downstream-wrapper-fleet.md
          grep -F 'Existing E2E repositories: **17**' dashboard/downstream-wrapper-fleet.md
          grep -F 'Repositories requiring provisioning: **0**' dashboard/downstream-wrapper-fleet.md
          grep -F 'Deterministic provisioned baselines: **2**' dashboard/downstream-wrapper-fleet.md
          grep -F 'zed-pkg/zed-sync#4' dashboard/downstream-wrapper-fleet.md
          grep -F 'akrion-sim/akrion-sim-e2e#2' dashboard/downstream-wrapper-fleet.md
          grep -F 'benefactor-cc/benefactor-e2e#2' dashboard/downstream-wrapper-fleet.md
          grep -F 'agent/den-313-opto-sync-e2e' dashboard/downstream-wrapper-fleet.md
          grep -F 'provisioned by DEN-1469 from opto-sync/opto-sync-e2e#25' \
            dashboard/downstream-wrapper-fleet.md

      - name: Upload deterministic review dashboard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: downstream-wrapper-fleet-dashboard
          path: dashboard/
          if-no-files-found: error
          retention-days: 14
