name: Model-based convergence

on:
  pull_request:
    paths:
      - 'formal/model-based-convergence.mjs'
      - 'formal/counterexamples/**'
      - 'formal/procedure.toml'
      - 'suite/conformance/scenarios/06-convergence.mjs'
      - '.github/workflows/model-based-convergence.yml'
  push:
    branches: [main]
    paths:
      - 'formal/model-based-convergence.mjs'
      - 'formal/counterexamples/**'
      - 'formal/procedure.toml'
      - 'suite/conformance/scenarios/06-convergence.mjs'
      - '.github/workflows/model-based-convergence.yml'
  schedule:
    - cron: '11 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-based-convergence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLIENTS_SHA: e3c51cde642ae384defebe5ed0829065cb9ddcff
  SYNCER_C_CLIENT_GITLINK_SHA: daade9935ce59a2fe84ec8b407d75ad1200428ed
  SYNCER_C_MAIN_SHA: bb9e4283a9a0abaf4243c150c9a8f868368a3dc7
  SYNCER_RS_SHA: cceb149f73a1a2783af44dfd49aa046063e23baa

jobs:
  reduced-model:
    name: seeded transport/replay model + broken-control proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact controller head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: controller
          persist-credentials: false

      - name: Checkout exact client source identity
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: opto-sync/opto-sync-clients
          ref: ${{ env.CLIENTS_SHA }}
          path: source/clients
          persist-credentials: false

      - name: Checkout client-paired C core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: opto-sync/syncer.c
          ref: ${{ env.SYNCER_C_CLIENT_GITLINK_SHA }}
          path: source/syncer-c-client-gitlink
          persist-credentials: false

      - name: Checkout current C core head snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: opto-sync/syncer.c
          ref: ${{ env.SYNCER_C_MAIN_SHA }}
          path: source/syncer-c-main
          persist-credentials: false

      - name: Checkout current Rust engine head snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: opto-sync/syncer.rs
          ref: ${{ env.SYNCER_RS_SHA }}
          path: source/syncer-rs
          persist-credentials: false

      - name: Verify exact source identities before modeling
        shell: bash
        env:
          OPTO_SYNC_E2E_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C controller rev-parse HEAD)" = "$OPTO_SYNC_E2E_SHA"
          test "$(git -C source/clients rev-parse HEAD)" = "$CLIENTS_SHA"
          test "$(git -C source/clients rev-parse HEAD:syncer.c)" = "$SYNCER_C_CLIENT_GITLINK_SHA"
          test "$(git -C source/syncer-c-client-gitlink rev-parse HEAD)" = "$SYNCER_C_CLIENT_GITLINK_SHA"
          test "$(git -C source/syncer-c-main rev-parse HEAD)" = "$SYNCER_C_MAIN_SHA"
          test "$(git -C source/syncer-rs rev-parse HEAD)" = "$SYNCER_RS_SHA"

      - name: Execute seeded reduced model and prove checker sensitivity
        working-directory: controller
        env:
          OPTO_SYNC_E2E_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OPTO_SYNC_CLIENTS_SHA: ${{ env.CLIENTS_SHA }}
          SYNCER_C_SHA: ${{ env.SYNCER_C_CLIENT_GITLINK_SHA }}
          SYNCER_C_MAIN_SHA: ${{ env.SYNCER_C_MAIN_SHA }}
          SYNCER_RS_SHA: ${{ env.SYNCER_RS_SHA }}
        run: |
          set -euo pipefail
          node --check formal/model-based-convergence.mjs
          node formal/model-based-convergence.mjs \
            --seeds 1,7,42,20260912 \
            --control-fixture formal/counterexamples/control-drop-tombstone.v1.json \
            --receipt artifacts/model-based-convergence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('artifacts/model-based-convergence.json').read_text())
          assert receipt['runtimeReplay']['status'] == 'modeling-only'
          assert receipt['checkerControl']['detected'] is True
          assert receipt['checkerControl']['minimizedEventCount'] == 2
          assert len(receipt['seeds']) == 4
          assert all(item['mutationCount'] == 24 for item in receipt['seeds'])
          assert 'no CRDT' in receipt['guaranteeScope']
          PY

      - name: Upload exact-head model receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-based-convergence-${{ github.run_id }}-${{ github.run_attempt }}
          path: controller/artifacts/model-based-convergence.json
          if-no-files-found: error
          retention-days: 30
