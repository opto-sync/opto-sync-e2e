name: fix IndexedDB migration wire-shape comparison

on:
  push:
    branches:
      - agent/DEN-525-indexeddb-migration-recovery

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/DEN-525-indexeddb-migration-recovery
          fetch-depth: 0
          persist-credentials: true
      - name: Compare the protocol request at its JSON wire boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/compatibility/indexeddb-migration.mjs')
          source = path.read_text()
          old = '    const pushRequest = await client.protocolPushRequest();\n'
          new = '''    const inMemoryPushRequest = await client.protocolPushRequest();
              assert.equal(inMemoryPushRequest.mutations[0]?.baseRevision, undefined);
              const pushRequest = JSON.parse(JSON.stringify(inMemoryPushRequest));
          '''
          if source.count(old) != 1:
              raise SystemExit('protocol push request insertion point changed')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check test/compatibility/indexeddb-migration.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/compatibility/indexeddb-migration.mjs
          git commit -m 'test: compare recovered push request at JSON wire boundary'
          git push origin HEAD:agent/DEN-525-indexeddb-migration-recovery
