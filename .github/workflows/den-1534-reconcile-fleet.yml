name: DEN-1534 reconcile provisioned E2E fleet

on:
  push:
    branches:
      - agent/den-1534-reconcile-provisioned-e2e-fleet
    paths:
      - '.github/workflows/den-1534-reconcile-fleet.yml'

permissions:
  contents: write

concurrency:
  group: den-1534-reconcile-provisioned-e2e-fleet
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/den-1534-reconcile-provisioned-e2e-fleet
          persist-credentials: true
          fetch-depth: 0

      - name: Replace stale provisioning gaps with reviewed existing PRs
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('operations/downstream-wrapper-fleet.v1.json')
          manifest = json.loads(path.read_text())
          reconciled = {}
          for key, value in manifest.items():
              reconciled[key] = value
              if key == 'ownerIssue':
                  reconciled['reconciliationIssue'] = 'DEN-1534'
          manifest = reconciled

          expected = {
              'akrion-sim/akrion-sim-e2e': {
                  'branch': 'agent/den-313-opto-sync-e2e',
                  'pullRequest': 2,
              },
              'benefactor-cc/benefactor-e2e': {
                  'branch': 'agent/den-313-opto-sync-e2e',
                  'pullRequest': 2,
              },
          }
          touched = set()
          for wrapper in manifest['wrappers']:
              repository = wrapper['e2e']['repository']
              if repository not in expected:
                  continue
              identity = expected[repository]
              wrapper['e2e'] = {
                  'status': 'existing',
                  'repository': repository,
                  'branch': identity['branch'],
                  'pullRequest': identity['pullRequest'],
                  'provisionedByIssue': 'DEN-1469',
                  'bootstrapSource': 'opto-sync/opto-sync-e2e#25',
                  'bootstrapMode': 'deterministic-starter',
              }
              touched.add(repository)
          if touched != set(expected):
              raise SystemExit(f'expected both reviewed E2E identities, found {sorted(touched)}')
          path.write_text(json.dumps(manifest, indent=2) + '\n')

      - name: Validate the reconciled manifest and deterministic dashboard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/check-downstream-wrapper-fleet.py
          python3 -m unittest suite.operations.test_downstream_wrapper_fleet -v
          python3 scripts/check-downstream-wrapper-fleet.py \
            --format json \
            --output "$RUNNER_TEMP/fleet.json"
          python3 scripts/check-downstream-wrapper-fleet.py \
            --format markdown \
            --output "$RUNNER_TEMP/fleet.md"
          grep -F '"existingE2e": 17' "$RUNNER_TEMP/fleet.json"
          grep -F '"provisioningRequired": 0' "$RUNNER_TEMP/fleet.json"
          grep -F '"provisionedBaselines": 2' "$RUNNER_TEMP/fleet.json"
          grep -F 'akrion-sim/akrion-sim-e2e#2' "$RUNNER_TEMP/fleet.md"
          grep -F 'benefactor-cc/benefactor-e2e#2' "$RUNNER_TEMP/fleet.md"

      - name: Remove this one-shot workflow and commit the reviewed reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1534-reconcile-fleet.yml
          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          git add operations/downstream-wrapper-fleet.v1.json
          git diff --cached --check
          git commit -m 'fix(DEN-1534): record all 17 existing E2E repositories'
          git push origin HEAD:agent/den-1534-reconcile-provisioned-e2e-fleet
