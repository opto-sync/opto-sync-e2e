name: provisioned E2E baseline reproducibility

on:
  pull_request:
    paths:
      - 'operations/downstream-wrapper-fleet.v1.json'
      - 'scripts/render-missing-e2e-repository.py'
      - 'scripts/render-missing-e2e-starter.py'
      - 'scripts/render-missing-e2e-archive.py'
      - 'suite/operations/test_missing_e2e_bootstrap.py'
      - '.github/workflows/missing-e2e-bootstrap.yml'
  push:
    branches:
      - main
    paths:
      - 'operations/downstream-wrapper-fleet.v1.json'
      - 'scripts/render-missing-e2e-repository.py'
      - 'scripts/render-missing-e2e-starter.py'
      - 'scripts/render-missing-e2e-archive.py'
      - 'suite/operations/test_missing_e2e_bootstrap.py'
      - '.github/workflows/missing-e2e-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Reproduce two deterministic provisioned baselines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout baseline controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compile renderers and run adversarial baseline tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/render-missing-e2e-repository.py \
            scripts/render-missing-e2e-starter.py \
            scripts/render-missing-e2e-archive.py
          python3 -m unittest suite.operations.test_missing_e2e_bootstrap -v

      - name: Verify reviewed repository and bootstrap identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          manifest = json.load(open('operations/downstream-wrapper-fleet.v1.json'))
          assert manifest['reconciliationIssue'] == 'DEN-1534'
          expected = {
              'akrion-sim/akrion-sim-e2e': {
                  'branch': 'agent/den-313-opto-sync-e2e',
                  'pullRequest': 2,
              },
              'benefactor-cc/benefactor-e2e': {
                  'branch': 'agent/den-313-opto-sync-e2e',
                  'pullRequest': 2,
              },
          }
          found = {}
          for wrapper in manifest['wrappers']:
              e2e = wrapper['e2e']
              repository = e2e['repository']
              if repository not in expected:
                  continue
              assert e2e['status'] == 'existing'
              assert e2e['branch'] == expected[repository]['branch']
              assert e2e['pullRequest'] == expected[repository]['pullRequest']
              assert e2e['provisionedByIssue'] == 'DEN-1469'
              assert e2e['bootstrapSource'] == 'opto-sync/opto-sync-e2e#25'
              assert e2e['bootstrapMode'] == 'deterministic-starter'
              assert 'blocker' not in e2e
              found[repository] = True
          assert set(found) == set(expected)
          PY

      - name: Render each provisioned baseline tree and archive twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline/a baseline/b baseline/artifacts
          repositories=(
            akrion-sim/akrion-sim-e2e
            benefactor-cc/benefactor-e2e
          )
          for repository in "${repositories[@]}"; do
            name="${repository#*/}"
            for copy in a b; do
              python3 scripts/render-missing-e2e-starter.py \
                --repository "$repository" \
                --out "baseline/$copy/$name"
              python3 scripts/render-missing-e2e-archive.py \
                --repository "$repository" \
                --archive "baseline/$copy/$name.tar.gz"
            done
            diff -qr "baseline/a/$name" "baseline/b/$name"
            cmp "baseline/a/$name.tar.gz" "baseline/b/$name.tar.gz"
            (
              cd "baseline/a/$name"
              python3 tests/opto-sync/adoption_contract.py
              node --check tests/opto-sync/product.e2e.test.mjs
            )
            tar -tzf "baseline/a/$name.tar.gz" > "baseline/artifacts/$name.contents.txt"
            cp "baseline/a/$name.tar.gz" "baseline/artifacts/$name.tar.gz"
          done
          (
            cd baseline/artifacts
            sha256sum *.tar.gz > SHA256SUMS
          )

      - name: Verify canonical archive metadata and content receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import tarfile

          expected = {
              'akrion-sim-e2e': 'akrion-sim/akrion-sim-e2e',
              'benefactor-e2e': 'benefactor-cc/benefactor-e2e',
          }
          for name, repository in expected.items():
              root = pathlib.Path('baseline/a') / name
              profile = json.loads((root / 'opto-sync-adoption.json').read_text())
              receipt = json.loads((root / 'bootstrap-receipt.json').read_text())
              workflow = (root / '.github/workflows/opto-sync-adoption.yml').read_text()
              assert profile['e2eRepository'] == repository
              assert receipt['repository'] == repository
              assert receipt['bootstrapIssue'] == 'DEN-1469'
              assert set(profile['releaseGates']) == {'DEN-309', 'DEN-363'}
              assert 'install --frozen --install-mode copy' in workflow
              assert 'OPTO_SYNC_REQUIRE_BROWSER=1' in workflow
              assert 'SYNC_FLEET_TOKEN' in workflow
              archive = pathlib.Path('baseline/artifacts') / f'{name}.tar.gz'
              data = archive.read_bytes()
              assert data[:2] == b'\x1f\x8b'
              assert data[4:8] == b'\x00\x00\x00\x00'
              assert data[3] & 0x08 == 0
              with tarfile.open(archive, 'r:gz') as handle:
                  members = handle.getmembers()
              assert len(members) == 9
              assert all(member.isfile() for member in members)
              assert all(member.mtime == 0 for member in members)
              assert all(member.uid == 0 and member.gid == 0 for member in members)
              assert all(member.uname == '' and member.gname == '' for member in members)
              assert [member.name for member in members] == sorted(member.name for member in members)
              assert all('..' not in pathlib.PurePosixPath(member.name).parts for member in members)
              assert all(re.fullmatch(r'[0-9a-f]{64}', item['sha256']) for item in receipt['files'])
          PY

      - name: Upload reviewed provisioned baseline artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provisioned-e2e-baselines
          path: baseline/artifacts/
          if-no-files-found: error
          retention-days: 30
