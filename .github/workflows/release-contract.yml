name: Release and compatibility contract

on:
  pull_request:
    paths:
      - 'release/**'
      - 'compatibility/**'
      - 'scripts/check-release-contract.py'
      - '.github/workflows/release-contract.yml'
  push:
    branches: [main]
    paths:
      - 'release/**'
      - 'compatibility/**'
      - 'scripts/check-release-contract.py'
      - '.github/workflows/release-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release-set and compatibility invariants
        run: python3 scripts/check-release-contract.py
