name: E2E (client-in-the-loop)

# Drives the real TypeScript, Dart, Rust, and Gleam clients against a live
# Node+Postgres server. The client repository contains its own pinned syncer.c
# submodule; the separate sibling checkout is the server-side core under test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      syncer_ref:
        description: 'Optional syncer.c ref for compatibility testing'
        required: false
        type: string
      clients_ref:
        description: 'Optional opto-sync-clients ref for compatibility testing'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Exact pair certified by this E2E revision. The clients commit pins the same
  # engine through its root syncer.c gitlink.
  SYNCER_C_REF: 7795ce2d1342e17d934d2faafff5c8ed4322609e
  CLIENTS_REF: 54874e9f7df6009fccd9034fce39306daef2c043

jobs:
  client-in-the-loop:
    name: test/clients/run_all.sh (ts + dart + rust + gleam vs live server)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout opto-sync-e2e
        uses: actions/checkout@v4
        with:
          path: opto-sync-e2e
          persist-credentials: false

      - name: Checkout syncer.c (pinned server core)
        uses: actions/checkout@v4
        with:
          repository: opto-sync/syncer.c
          ref: ${{ github.event.inputs.syncer_ref || env.SYNCER_C_REF }}
          path: syncer.c
          persist-credentials: false

      - name: Checkout opto-sync-clients and nested pinned core
        uses: actions/checkout@v4
        with:
          repository: opto-sync/opto-sync-clients
          ref: ${{ github.event.inputs.clients_ref || env.CLIENTS_REF }}
          path: opto-sync-clients
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Verify certified client and nested core pair
        shell: bash
        run: |
          set -euo pipefail
          expected_nested="$(git -C opto-sync-clients ls-tree HEAD syncer.c | awk '{print $3}')"
          actual_nested="$(git -C opto-sync-clients/syncer.c rev-parse HEAD)"
          server_core="$(git -C syncer.c rev-parse HEAD)"
          test -n "$expected_nested"
          test "$expected_nested" = "$actual_nested"
          test "$actual_nested" = "$server_core"
          test -f opto-sync-clients/syncer.c/core/include/syncer.h
          git -C opto-sync-clients submodule status --recursive
          printf 'clients=%s\nserver-core=%s\nnested-core=%s\n' \
            "$(git -C opto-sync-clients rev-parse HEAD)" "$server_core" "$actual_nested"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: opto-sync-clients/clients/ts/package-lock.json

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install pinned OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'

      - name: Install SQLite system library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      - name: Install pinned Gleam compiler
        run: |
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sha256sum -c gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sudo tar -xzf gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz -C /usr/local/bin gleam

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-e2e-clients-${{ hashFiles('opto-sync-e2e/test/clients/rust/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-e2e-clients-

      - name: Build server syncer.c shared library
        working-directory: syncer.c/core
        run: |
          mkdir -p build
          cd build
          cmake ..
          make syncer
          ls -l libsyncer.so

      # @opto-sync/client links the nested binding. npm does not install the
      # linked package's own dependencies, so install its committed graph first.
      - name: Install nested syncer.c TypeScript binding dependencies first
        working-directory: opto-sync-clients/syncer.c/bindings/typescript
        run: npm ci

      - name: Build @opto-sync/client (dist plus locked dev dependencies)
        working-directory: opto-sync-clients/clients/ts
        run: |
          npm ci
          npm run build

      - name: Install Chromium for IndexedDB process-restart coverage
        working-directory: opto-sync-clients/clients/ts
        run: npx playwright install --with-deps chromium

      - name: Pre-fetch locked Rust dependencies
        working-directory: opto-sync-e2e/test/clients/rust
        run: cargo fetch --locked

      - name: Pre-resolve Dart dependencies
        working-directory: opto-sync-e2e/test/clients/dart
        run: dart pub get

      - name: Build BEAM NIF and pre-resolve Gleam live-client dependencies
        run: |
          cd syncer.c/bindings/beam
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
          cd ../../../opto-sync-e2e/test/clients/gleam
          gleam deps download
          gleam format --check src test

      - name: Install .dockerignore at the build context root
        run: cp opto-sync-e2e/context.dockerignore .dockerignore

      - name: Ensure .env exists without logging values
        working-directory: opto-sync-e2e
        run: |
          set -euo pipefail
          [ -f .env ] || cp .env.example .env
          test -s .env
          count="$(grep -Ec '^[A-Za-z_][A-Za-z0-9_]*=' .env || true)"
          echo ".env is present with ${count} declared variable(s); values redacted"

      - name: Validate Compose configuration
        working-directory: opto-sync-e2e
        run: docker compose config --quiet

      - name: Start postgres and node server
        working-directory: opto-sync-e2e
        run: docker compose up -d --build postgres node

      - name: Wait for the node server to report a native core
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 http://localhost:3003/health > /tmp/health.json; then
              cat /tmp/health.json; echo
              grep -q '"syncer":"native"' /tmp/health.json && exit 0
              echo "server up but not native yet"
            fi
            sleep 2
          done
          echo "::error title=node server never became healthy::http://localhost:3003/health did not report a native syncer core within 120s"
          exit 1

      - name: test/clients/run_all.sh
        working-directory: opto-sync-e2e
        env:
          OPTO_SYNC_REQUIRE_SERVER: '1'
          OPTO_SYNC_SERVER_URL: http://localhost:3003
          SYNCER_LIB_PATH: ${{ github.workspace }}/syncer.c/core/build/libsyncer.so
        run: ./test/clients/run_all.sh

      - name: Collect compose logs
        if: failure()
        working-directory: opto-sync-e2e
        run: |
          docker compose logs --no-color --timestamps > compose-logs.txt 2>&1 || true
          docker compose ps -a > compose-ps.txt 2>&1 || true
          tail -n 200 compose-logs.txt || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-client-in-the-loop
          path: |
            opto-sync-e2e/compose-logs.txt
            opto-sync-e2e/compose-ps.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Which suite broke
        if: failure()
        run: |
          echo "::error title=opto-sync-e2e client-in-the-loop FAILED::The live TypeScript, Dart, Rust, or Gleam client suite broke; inspect the run summary and compose logs."

      - name: Tear down (always)
        if: always()
        working-directory: opto-sync-e2e
        run: docker compose down -v --remove-orphans || true
