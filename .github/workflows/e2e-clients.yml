name: E2E (client-in-the-loop)

# test/clients/run_all.sh — the only e2e suite that runs on the HOST rather than
# in a container: it drives the four real client libraries from
# ../opto-sync-clients (ts / dart / rust / gleam) against a live node+Postgres
# server, then makes the first three agree on one document (scenario 7,
# cross-client convergence). It needs all four toolchains locally, so it gets
# its own job.
#
# LAYOUT: run_all.sh resolves CLIENTS_ROOT as ../../../opto-sync-clients/clients
# and the suites path-depend on ../../../../opto-sync-clients/clients/*,
# so all three repositories are checked out as siblings under $GITHUB_WORKSPACE:
#
#   $GITHUB_WORKSPACE/
#     syncer.c/
#     opto-sync-clients/
#     opto-sync-e2e/   <- this repo
#
# PLATFORM: ubuntu-latest. The core shared library built here is libsyncer.so;
# SYNCER_LIB_PATH points at it explicitly so no .dylib default is ever hit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      syncer_ref:
        description: 'Optional syncer.c ref for compatibility testing'
        required: false
        type: string
      clients_ref:
        description: 'Optional opto-sync-clients ref for compatibility testing'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Immutable defaults make this E2E commit reproducible. Manual dispatch can
  # deliberately substitute `main`, a PR branch, or a candidate SHA.
  SYNCER_C_REF: c05651e4dc5473c791569b957c23fd2c2b886422
  CLIENTS_REF: 331e948fd26c13f0f975aa09b477b64e71fc8e12

jobs:
  client-in-the-loop:
    name: test/clients/run_all.sh (ts + dart + rust + gleam vs live server)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout opto-sync-e2e
        uses: actions/checkout@v4
        with:
          path: opto-sync-e2e
          persist-credentials: false

      - name: Checkout syncer.c (pinned sibling)
        uses: actions/checkout@v4
        with:
          repository: opto-sync/syncer.c
          ref: ${{ github.event.inputs.syncer_ref || env.SYNCER_C_REF }}
          path: syncer.c
          persist-credentials: false

      - name: Checkout opto-sync-clients (pinned libraries under test)
        uses: actions/checkout@v4
        with:
          repository: opto-sync/opto-sync-clients
          ref: ${{ github.event.inputs.clients_ref || env.CLIENTS_REF }}
          path: opto-sync-clients
          persist-credentials: false

      # --- toolchains --------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # ~/.npm tarballs only — never node_modules or the compiled addon.
          cache: npm
          cache-dependency-path: opto-sync-clients/clients/ts/package-lock.json

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Rustler 0.38 requires Elixir 1.15+; Ubuntu 24.04's apt package remains
      # on 1.14 and fails before compiling the NIF.
      - name: Install pinned OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'

      # Dart opens real SQLite.
      - name: Install SQLite system library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      - name: Install pinned Gleam compiler
        run: |
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sha256sum -c gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sudo tar -xzf gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz -C /usr/local/bin gleam

      # Rust stable is preinstalled on ubuntu-latest. Downloads only, no target/.
      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-e2e-clients-${{ hashFiles('opto-sync-e2e/test/clients/rust/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-e2e-clients-

      # --- build what the suites need ----------------------------------------
      # Dart FFI (both the client library and the e2e dart suite) needs the core
      # shared library. On Linux: syncer.c/core/build/libsyncer.so.
      - name: Build syncer.c core shared library
        working-directory: syncer.c/core
        run: |
          mkdir -p build
          cd build
          cmake ..
          make syncer
          ls -l libsyncer.so

      # WORKAROUND (verified): clients/ts declares a local syncer package. npm
      # links it without installing that linked package's own dependencies, while
      # binding.gyp evaluates require('node-addon-api').include. Install the
      # binding's committed dependency graph first, then the client's.
      - name: Install locked syncer.c TypeScript binding dependencies first
        working-directory: syncer.c/bindings/typescript
        run: npm ci

      # run_all.sh hard-aborts if clients/ts/node_modules/fake-indexeddb is
      # missing, and builds dist/ itself only as a fallback. Do both up front so
      # a build error is reported as a build error.
      - name: Build @opto-sync/client (dist/ + locked dev dependencies)
        working-directory: opto-sync-clients/clients/ts
        run: |
          npm ci
          npm run build

      # The restart test closes and relaunches Chromium with one persistent
      # profile to prove native IndexedDB survives an actual browser process,
      # not merely a Dexie connection reopen.
      - name: Install Chromium for IndexedDB process-restart coverage
        working-directory: opto-sync-clients/clients/ts
        run: npx playwright install --with-deps chromium

      # run_all.sh uses cargo in offline mode. The lockfile is committed, so
      # populate the registry without regenerating or mutating the graph.
      - name: Pre-fetch locked Rust dependencies
        working-directory: opto-sync-e2e/test/clients/rust
        run: cargo fetch --locked

      # Dart's e2e fixture is an application-local test package and currently has
      # no committed lockfile. Resolve it before run_all.sh tries offline first.
      - name: Pre-resolve Dart dependencies
        working-directory: opto-sync-e2e/test/clients/dart
        run: dart pub get

      - name: Build BEAM NIF and pre-resolve Gleam live-client dependencies
        run: |
          cd syncer.c/bindings/beam
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
          cd ../../../opto-sync-e2e/test/clients/gleam
          gleam deps download
          gleam format --check src test

      # --- the server the suite runs against ---------------------------------
      - name: Install .dockerignore at the build context root
        run: cp opto-sync-e2e/context.dockerignore .dockerignore

      - name: Ensure .env exists without logging values
        working-directory: opto-sync-e2e
        run: |
          set -euo pipefail
          [ -f .env ] || cp .env.example .env
          test -s .env

      - name: Validate Compose configuration
        working-directory: opto-sync-e2e
        run: docker compose config --quiet

      # Only postgres + node: run_all.sh talks to the published port 3003 and
      # deliberately never runs docker compose or POST /reset itself.
      - name: Start postgres + node server
        working-directory: opto-sync-e2e
        run: docker compose up -d --build postgres node

      - name: Wait for the node server to report a native core
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 http://localhost:3003/health > /tmp/health.json; then
              cat /tmp/health.json; echo
              grep -q '"syncer":"native"' /tmp/health.json && exit 0
              echo "server up but not native yet"
            fi
            sleep 2
          done
          echo "::error title=node server never became healthy::http://localhost:3003/health did not report {\"syncer\":\"native\"} within 120s"
          exit 1

      # --- the suite ---------------------------------------------------------
      # OPTO_SYNC_REQUIRE_SERVER=1 turns "server unreachable" from a silent SKIP
      # (exit 0) into a failure — without it this job could pass while testing
      # nothing at all.
      - name: test/clients/run_all.sh
        working-directory: opto-sync-e2e
        env:
          OPTO_SYNC_REQUIRE_SERVER: '1'
          OPTO_SYNC_SERVER_URL: http://localhost:3003
          SYNCER_LIB_PATH: ${{ github.workspace }}/syncer.c/core/build/libsyncer.so
        run: ./test/clients/run_all.sh

      # --- diagnostics + teardown -------------------------------------------
      - name: Collect compose logs
        if: failure()
        working-directory: opto-sync-e2e
        run: |
          docker compose logs --no-color --timestamps > compose-logs.txt 2>&1 || true
          docker compose ps -a > compose-ps.txt 2>&1 || true
          tail -n 200 compose-logs.txt || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-client-in-the-loop
          path: |
            opto-sync-e2e/compose-logs.txt
            opto-sync-e2e/compose-ps.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Which suite broke
        if: failure()
        run: |
          echo "::error title=opto-sync-e2e client-in-the-loop FAILED::test/clients/run_all.sh broke (ts, dart, rust, or gleam client vs the live node server) — the per-language PASS/FAIL summary is at the end of the run_all.sh step, and server logs are in the compose-logs-client-in-the-loop artifact."

      # Ephemeral runner, so `down -v` is safe here (unlike locally, where the
      # Postgres volume is shared with other suites).
      - name: Tear down (always)
        if: always()
        working-directory: opto-sync-e2e
        run: docker compose down -v --remove-orphans || true
