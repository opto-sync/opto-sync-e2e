name: Publish Zed package

on:
  pull_request:
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - '.github/workflows/zed-publish.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout package with tag history
        uses: actions/checkout@v4
        with:
          path: package
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned Zed CLI
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-cli
          ref: c636fb8f6b08695c6b4fe94e2481f4d57270b2d7
          path: zed-cli
          persist-credentials: false

      - name: Checkout pinned Zed interfaces
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: 415e871b1fb3dd97744c134351408a3224805dfb
          path: zed-interfaces
          persist-credentials: false

      - name: Build pinned Zed CLI
        run: cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed

      - name: Validate package on pull requests
        if: github.event_name == 'pull_request'
        working-directory: package
        run: |
          set -euo pipefail
          ../zed-cli/target/release/zed publish \
            --dry-run \
            --allow-dirty \
            --skip-vcs-checks

      - name: Require a reviewed version tag
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *) echo "select or push a v* tag; refusing branch publication" >&2; exit 1 ;;
          esac

      - name: Publish immutable Zed artifact
        if: github.event_name != 'pull_request'
        working-directory: package
        env:
          ZED_PKG_TOKEN: ${{ secrets.ZED_PKG_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ZED_PKG_TOKEN"
          ../zed-cli/target/release/zed publish
