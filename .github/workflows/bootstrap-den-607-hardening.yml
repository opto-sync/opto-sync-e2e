name: Assemble audited DEN-607 hardening payload

on:
  push:
    branches:
      - agent/den-607-zed-consumer-impact
    paths:
      - '.bootstrap/hardening/ready'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: agent/den-607-zed-consumer-impact

      - name: Verify and extract audited source payload
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check <<'CHECKSUMS'
          407ffde7b423454ae9834ecf6833a47df1e37fdb171e17259eaf99ecdf9ad7c6  .bootstrap/hardening/chunk-000
          a9721b7136b8cf529b95e4e08c0b0a16740d4e8a4f4eaba69d3d32bbf2d50610  .bootstrap/hardening/chunk-001
          b9ad441ab57da32cb524ea048d38251d8d1731254e700125aa006738bfdbde6b  .bootstrap/hardening/chunk-002
          f922af9ca5b7fe957cb16fbd08cec7d080135992379638d3b7a8e32a5f3171be  .bootstrap/hardening/chunk-003
          CHECKSUMS
          cat .bootstrap/hardening/chunk-* | base64 --decode > /tmp/den-607-hardening.tar.gz
          echo '4dbb16a9ee973eb973427d46a40a81a66ebf50a22d438acd226a8600ea2e9a49  /tmp/den-607-hardening.tar.gz' | sha256sum --check
          tar -tzf /tmp/den-607-hardening.tar.gz | while IFS= read -r path; do
            case "$path" in
              scripts/zed_consumer_graph.py|scripts/secure_zed_consumer_graph.py|suite/operations/test_zed_consumer_graph.py|suite/operations/test_secure_zed_consumer_graph.py|docs/zed-consumer-impact.md) ;;
              scripts/|suite/|suite/operations/|docs/) ;;
              *) echo "unexpected payload path: $path" >&2; exit 1 ;;
            esac
          done
          tar -xzf /tmp/den-607-hardening.tar.gz -C .
          rm -rf .bootstrap/hardening

      - name: Re-run exact source checks before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/zed_consumer_graph.py \
            scripts/secure_zed_consumer_graph.py \
            suite/operations/test_zed_consumer_graph.py \
            suite/operations/test_secure_zed_consumer_graph.py
          python3 -m unittest \
            suite.operations.test_zed_consumer_graph \
            suite.operations.test_secure_zed_consumer_graph \
            -v
          git diff --check

      - name: Commit verified source hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'opto-sync automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/zed_consumer_graph.py \
            scripts/secure_zed_consumer_graph.py \
            suite/operations/test_zed_consumer_graph.py \
            suite/operations/test_secure_zed_consumer_graph.py \
            docs/zed-consumer-impact.md \
            .bootstrap/hardening
          git diff --cached --check
          git commit -m 'fix(zed): harden registry census and credential boundaries'
          git push origin HEAD:agent/den-607-zed-consumer-impact
