name: IndexedDB migration recovery

on:
  pull_request:
    paths:
      - 'compatibility/contract.v1.json'
      - 'compatibility/fixtures/**'
      - 'scripts/check-historical-fixtures.py'
      - 'suite/compatibility/indexeddb-migration.mjs'
      - 'docs/COMPATIBILITY_FIXTURES.md'
      - '.github/workflows/indexeddb-migration.yml'
  push:
    branches: [main]
    paths:
      - 'compatibility/contract.v1.json'
      - 'compatibility/fixtures/**'
      - 'scripts/check-historical-fixtures.py'
      - 'suite/compatibility/indexeddb-migration.mjs'
      - 'docs/COMPATIBILITY_FIXTURES.md'
      - '.github/workflows/indexeddb-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexeddb-migration-${{ github.ref }}
  cancel-in-progress: true

env:
  OPTO_SYNC_CLIENTS_SHA: 38f0fcc6a471455a0a20aec5f7fa63d3f70d5f89
  SYNCER_C_SHA: 8d2b275a89062403666f4bdf196d246a07c84484

jobs:
  chromium-indexeddb:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout compatibility fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: opto-sync-e2e
          persist-credentials: false

      - name: Checkout the certified browser client and nested core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/opto-sync-clients
          ref: ${{ env.OPTO_SYNC_CLIENTS_SHA }}
          path: opto-sync-clients
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Verify the certified client/core pair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C opto-sync-clients rev-parse HEAD)" = "$OPTO_SYNC_CLIENTS_SHA"
          test "$(git -C opto-sync-clients rev-parse HEAD:syncer.c)" = "$SYNCER_C_SHA"
          test "$(git -C opto-sync-clients/syncer.c rev-parse HEAD)" = "$SYNCER_C_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: opto-sync-clients/clients/ts/package-lock.json

      - name: Build the exact TypeScript browser client
        shell: bash
        run: |
          set -euo pipefail
          cd opto-sync-clients/syncer.c/bindings/typescript
          npm ci
          cd ../../../clients/ts
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Verify fixture checksums and SQLite recovery first
        working-directory: opto-sync-e2e
        run: python3 scripts/check-historical-fixtures.py

      - name: Run persistent-profile Chromium migration interruption and recovery
        env:
          OPTO_SYNC_E2E_ROOT: ${{ github.workspace }}/opto-sync-e2e
          OPTO_SYNC_CLIENTS_ROOT: ${{ github.workspace }}/opto-sync-clients
          INDEXEDDB_MIGRATION_DIAGNOSTICS: ${{ runner.temp }}/indexeddb-migration-diagnostics.json
        run: node opto-sync-e2e/suite/compatibility/indexeddb-migration.mjs

      - name: Upload synthetic logical diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: indexeddb-migration-diagnostics
          path: ${{ runner.temp }}/indexeddb-migration-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
