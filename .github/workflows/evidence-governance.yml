name: Evidence governance

on:
  pull_request:
    paths:
      - "contracts/**"
      - "conformance/**"
      - "governance/**"
      - "formal/**"
      - "tools/evidence-governance.rs"
      - "tools/evidence-governance/**"
      - ".github/workflows/evidence-governance.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "conformance/**"
      - "governance/**"
      - "formal/**"
      - "tools/evidence-governance.rs"
      - "tools/evidence-governance/**"
      - ".github/workflows/evidence-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.90.0

      - name: Compile evidence-governance verifier
        run: rustc --edition=2021 -D warnings tools/evidence-governance.rs -o /tmp/opto-sync-evidence-governance

      - name: Reject mutable and malformed implementation bindings
        run: |
          rustc --edition=2021 -D warnings --test tools/evidence-governance.rs -o /tmp/opto-sync-evidence-tests
          /tmp/opto-sync-evidence-tests

      - name: Validate evidence classes and repository references
        run: /tmp/opto-sync-evidence-governance
