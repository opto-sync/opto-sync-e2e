name: Assemble DEN-607 consumer-impact payload

on:
  push:
    branches:
      - agent/den-607-zed-consumer-impact
    paths:
      - .bootstrap/ready
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  assemble:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Verify and assemble tested non-workflow payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .bootstrap/ready ]]; then
            echo 'Bootstrap payload already assembled.'
            exit 0
          fi
          sha256sum --check <<'CHECKSUMS'
          236484a5c5988bdd32264be5d9a7cbb9509ce2fec381f674daf524bab3f53f96  .bootstrap/chunks/chunk-000.b64
          77b29056b10dc4cf928dd14073cafed829cdfdf80cf53e53a782e39ed57e5a68  .bootstrap/chunks/chunk-001.b64
          bf1fe9cc75bfc877a6df1617126364e720f3dcf6af4f0aeb7135bd97cd2f2ece  .bootstrap/chunks/chunk-002.b64
          21f930f6d05d326787b597a39bb44ba2da74fe8923b4e1c9ee027d97def86f20  .bootstrap/chunks/chunk-003.b64
          3c2b7d9f321fd25bc607d431228087eb72e85bce715cff8b817459b1d3c7fb40  .bootstrap/chunks/chunk-004.b64
          378f8b71c2ab716646d26fb71b4e24dbbbc9db4211aa5b8ef0c1bea50422e3a9  .bootstrap/chunks/chunk-005.b64
          58b5e633df42996b18d105a6554c4fbd5cf12fa87fb18de536709355ca5160a4  .bootstrap/chunks/chunk-006.b64
          db567b01fbe9a6a2797cef21b6db9fa6e901f4e6f3f38fe6b1d585cb90a887ac  .bootstrap/chunks/chunk-007.b64
          e58a558b54e5226b2f98b48ade8fc6afaaf53b78f7975f6f9c8d5b2b3cb30a06  .bootstrap/chunks/chunk-008.b64
          86b6c37237fcae03ffb5e026ec68afb433a6d1d423d2fc4c227280c53953e8eb  .bootstrap/chunks/chunk-009.b64
          CHECKSUMS
          cat .bootstrap/chunks/chunk-*.b64 | base64 --decode > /tmp/opto-sync-e2e-payload.tar.gz
          echo '4504def770a89bb80c2313d70353c7744c775e7d19ef87e6354a38a71138bbbb  /tmp/opto-sync-e2e-payload.tar.gz' | sha256sum --check
          tar -xzf /tmp/opto-sync-e2e-payload.tar.gz -C .
          rm -rf .bootstrap
          # GitHub's runner token may not create/update workflow files. The
          # connected GitHub App publishes the reviewed workflow separately.
          rm -f .github/workflows/zed-consumer-impact.yml

      - name: Commit exact verified non-workflow test harness
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .bootstrap/ready ]]; then
            echo 'Bootstrap payload was not consumed.' >&2
            exit 1
          fi
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git config user.name 'opto-sync automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows/bootstrap-den-607.yml'
          if git diff --cached --quiet; then
            echo 'No non-workflow bootstrap changes remain.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'test(zed): derive Opto-Sync consumer impact from declared graphs'
          git push origin "HEAD:${target_branch}"
