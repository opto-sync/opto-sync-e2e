name: E2E (docker)

# The docker-based e2e suites: full multi-runtime curl suite, the conformance
# scenarios, cross-server convergence, and the Supabase/PostgREST path.
#
# LAYOUT (this is the load-bearing part): every service in docker-compose.yml
# builds with `context: ../` -- the PARENT of this repo -- and the Dockerfiles
# `COPY syncer.c/core/`, `COPY syncer.c/bindings/...` and
# `COPY opto-sync-e2e/servers/...`. So the three repos must sit as siblings:
#
#   $GITHUB_WORKSPACE/          <- docker build context
#     syncer.c/
#     opto-sync-clients/        (kept for shared-layout parity)
#     opto-sync-e2e/            <- this repo, compose working directory
#
# Docker only honors a .dockerignore at the CONTEXT root, so
# opto-sync-e2e/context.dockerignore is copied to $GITHUB_WORKSPACE/.dockerignore
# exactly as README.md's Setup section instructs. Without it, host
# node_modules/target/build trees leak into the context and can shadow in-image
# dependency installs.
#
# PLATFORM: ubuntu-latest. All images are Linux images that compile the core to
# libsyncer.so themselves (see servers/*/Dockerfile) -- nothing here depends on
# the macOS .dylib produced on the dev machines.
#
# Docker layer caching is intentionally NOT enabled: the images embed the C core
# by COPYing syncer.c/, and a cross-run layer cache is one more place a stale
# core could hide. These suites exist to catch exactly that.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      syncer_ref:
        description: 'Optional syncer.c ref for compatibility testing'
        required: false
        type: string
      clients_ref:
        description: 'Optional opto-sync-clients ref for compatibility testing'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Ordinary CI is reproducible. Manual dispatch may opt into `main`, a PR
  # branch, or another candidate SHA without making every E2E run follow mutable
  # cross-repository state.
  SYNCER_C_REF: c05651e4dc5473c791569b957c23fd2c2b886422
  CLIENTS_REF: 331e948fd26c13f0f975aa09b477b64e71fc8e12

jobs:
  repository-contract:
    name: cross-repository CI contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout opto-sync-e2e
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable refs and secret-safe workflow text
        run: python3 scripts/check-ci-contract.py

  suite:
    name: e2e ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Two of the five images are static Rust/musl builds (rust-mash links
    # OpenSSL statically), so a cold build is slow -- but nowhere near 6 hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fulltest (node + rust-fullstack + dart + sagitta)
            id: fulltest
          - name: conformance (scenarios vs Postgres-backed node)
            id: conformance
          - name: protocol v1 (idempotency + ordered checkpoints)
            id: protocol
          - name: protocol auth (subject/client + tenant isolation)
            id: auth
          - name: protocol JWT auth (Supabase JWKS + signed claims)
            id: jwt-auth
          - name: protocol operations (quotas + rate + metrics)
            id: operations
          - name: protocol load (concurrency + latency)
            id: load
          - name: protocol recovery (migrations + backup/restore)
            id: recovery
          - name: crossserver (4 runtimes converge)
            id: crossserver
          - name: supabase (PostgREST stand-in for the REST path)
            id: supabase
    steps:
      - name: Checkout opto-sync-e2e
        uses: actions/checkout@v4
        with:
          path: opto-sync-e2e
          persist-credentials: false

      - name: Checkout syncer.c (pinned sibling used by every image)
        uses: actions/checkout@v4
        with:
          repository: opto-sync/syncer.c
          ref: ${{ github.event.inputs.syncer_ref || env.SYNCER_C_REF }}
          path: syncer.c
          persist-credentials: false

      - name: Checkout opto-sync-clients (pinned sibling for layout parity)
        uses: actions/checkout@v4
        with:
          repository: opto-sync/opto-sync-clients
          ref: ${{ github.event.inputs.clients_ref || env.CLIENTS_REF }}
          path: opto-sync-clients
          persist-credentials: false

      # README.md, "Setup": the build context is the parent directory, so the
      # .dockerignore has to live there.
      - name: Install .dockerignore at the build context root
        run: |
          cp opto-sync-e2e/context.dockerignore .dockerignore
          echo "context root: $(pwd)"
          ls -a

      # Compose hard-fails on a missing env_file. Never print the file: a local
      # or future CI override may contain credentials even though the checked-in
      # example is non-secret.
      - name: Ensure .env exists without logging values
        working-directory: opto-sync-e2e
        run: |
          set -euo pipefail
          [ -f .env ] || cp .env.example .env
          test -s .env
          count="$(grep -Ec '^[A-Za-z_][A-Za-z0-9_]*=' .env || true)"
          echo ".env is present with ${count} declared variable(s); values redacted"

      - name: Docker and Compose preflight
        working-directory: opto-sync-e2e
        run: |
          docker --version
          docker compose version
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml config --quiet

      # These profiles start additional containers from the same image as the
      # `node` service. Compose may try to pull those aliases before `node` has
      # finished building, even with `up --build`, so materialize the shared
      # image first on each isolated runner that exercises an alias.
      - name: Build shared Node image for profile aliases
        if: >-
          matrix.id == 'auth' ||
          matrix.id == 'jwt-auth' ||
          matrix.id == 'operations' ||
          matrix.id == 'recovery'
        working-directory: opto-sync-e2e
        run: docker compose build node

      # --- suites ------------------------------------------------------------
      # `--exit-code-from <svc>` implies --abort-on-container-exit, so the job's
      # exit status is the test runner's.
      - name: fulltest — run_e2e_full.sh across all in-memory servers
        if: matrix.id == 'fulltest'
        working-directory: opto-sync-e2e
        run: |
          docker compose --profile fulltest --profile fullstack --profile dart --profile sagitta \
            up --build --exit-code-from test-runner-full

      - name: conformance — test/conformance/run.mjs vs node+Postgres
        if: matrix.id == 'conformance'
        working-directory: opto-sync-e2e
        run: |
          docker compose --profile conformance \
            up --build --exit-code-from conformance

      - name: protocol — test/protocol/run.mjs vs node+Postgres
        if: matrix.id == 'protocol'
        working-directory: opto-sync-e2e
        run: |
          docker compose --profile protocol \
            up --build --exit-code-from protocol

      - name: protocol auth — production-mode adversarial isolation
        if: matrix.id == 'auth'
        working-directory: opto-sync-e2e
        run: |
          docker compose --profile auth \
            up --build --exit-code-from auth-protocol

      - name: protocol JWT auth — Supabase-compatible verification and isolation
        if: matrix.id == 'jwt-auth'
        working-directory: opto-sync-e2e
        run: |
          docker compose --profile jwt-auth \
            up --build --exit-code-from jwt-auth-protocol

      - name: protocol operations — quotas, rate limits, metrics, audit
        if: matrix.id == 'operations'
        working-directory: opto-sync-e2e
        run: |
          docker compose --profile operations \
            up --build --exit-code-from operations-protocol

      - name: protocol load — concurrent writes, retries, and latency bounds
        if: matrix.id == 'load'
        working-directory: opto-sync-e2e
        run: |
          docker compose --profile load \
            up --build --exit-code-from protocol-load

      - name: protocol recovery — concurrent migrations and dump/restore drill
        if: matrix.id == 'recovery'
        working-directory: opto-sync-e2e
        run: |
          docker compose --profile recovery \
            up --build --exit-code-from protocol-backup-restore

      - name: crossserver — test/cross-server/run.mjs across 4 runtimes
        if: matrix.id == 'crossserver'
        working-directory: opto-sync-e2e
        run: |
          docker compose --profile crossserver --profile fullstack --profile dart --profile sagitta \
            up --build --exit-code-from cross-server

      # Two-step by design (test/supabase/README.md): the override file repoints
      # rust-mash at the local PostgREST stand-in, and supabase-init must have
      # completed before the suite runs. Bringing rust-mash up from the main
      # compose file alone leaves it on the .env placeholder.
      - name: supabase — bring up postgrest + rust-mash (override file)
        if: matrix.id == 'supabase'
        working-directory: opto-sync-e2e
        run: |
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml \
            up -d --build postgrest rust-mash

      - name: supabase — run test/supabase/run.mjs in-network
        if: matrix.id == 'supabase'
        working-directory: opto-sync-e2e
        run: |
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml \
            --profile supabasetest run --rm supabase-test

      # --- diagnostics + teardown -------------------------------------------
      - name: Collect compose logs
        if: failure()
        working-directory: opto-sync-e2e
        run: |
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml \
            logs --no-color --timestamps > compose-logs.txt 2>&1 || true
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml \
            ps -a > compose-ps.txt 2>&1 || true
          tail -n 200 compose-logs.txt || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-${{ matrix.id }}
          path: |
            opto-sync-e2e/compose-logs.txt
            opto-sync-e2e/compose-ps.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Which suite broke
        if: failure()
        run: |
          echo "::error title=opto-sync-e2e ${{ matrix.id }} FAILED::The '${{ matrix.id }}' e2e suite broke. Full container logs are in the compose-logs-${{ matrix.id }} artifact."

      # Safe here in a way it is NOT locally: this runner is ephemeral and owns
      # the whole stack, so `down -v` cannot yank the shared Postgres out from
      # under a concurrent suite.
      - name: Tear down (always)
        if: always()
        working-directory: opto-sync-e2e
        run: |
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml \
            down -v --remove-orphans || true
