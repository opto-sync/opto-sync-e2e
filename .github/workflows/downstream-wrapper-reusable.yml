name: reusable downstream opto-sync wrapper resilience

on:
  workflow_call:
    inputs:
      manifest_path:
        description: Zed manifest in the caller repository
        required: false
        default: .zpkg.toml
        type: string
      lock_path:
        description: Zed lockfile in the caller repository
        required: false
        default: .zpkg.lock
        type: string
      profile_path:
        description: Product wrapper profile in the caller repository
        required: false
        default: opto-sync-adapter.json
        type: string

permissions:
  contents: read

concurrency:
  group: downstream-wrapper-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate wrapper resilience and immutable dependency boundaries
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          LOCK_PATH: ${{ inputs.lock_path }}
          PROFILE_PATH: ${{ inputs.profile_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import configparser
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          def safe_path(value: str) -> pathlib.Path:
              path = pathlib.PurePosixPath(value)
              assert value and not path.is_absolute() and '..' not in path.parts
              return pathlib.Path(value)

          manifest_path = safe_path(os.environ['MANIFEST_PATH'])
          lock_path = safe_path(os.environ['LOCK_PATH'])
          profile_path = safe_path(os.environ['PROFILE_PATH'])
          manifest_text = manifest_path.read_text()
          manifest = tomllib.loads(manifest_text)
          lock = tomllib.loads(lock_path.read_text())
          profile = json.loads(profile_path.read_text())

          dependency = 'opto-sync/opto-sync-clients'
          assert profile['repository'] == os.environ['GITHUB_REPOSITORY']
          packages = lock.get('package', [])

          if 'sourceAuthority' in profile:
              # Pre-publication wrappers may consume immutable Git submodules,
              # but a copied directory or merely documented SHA is not source
              # identity. Require an actual HEAD gitlink plus canonical .gitmodules
              # URL for both the C core and client repository.
              source = profile['sourceAuthority']
              assert 'dependency' not in profile
              assert source['kind'] == 'git-submodules'
              assert source['installRoot'] == 'vendor'
              assert profile['releaseState'] == 'source-pinned-until-certified-package-published'
              assert dependency not in manifest.get('dependencies', {})
              safe_path(manifest['install']['dir'])
              assert lock.get('version') == 1 and packages == []

              gitmodules_path = pathlib.Path('.gitmodules')
              assert gitmodules_path.is_file()
              modules = configparser.ConfigParser()
              modules.read_string(gitmodules_path.read_text())
              expected_sources = {
                  'syncerC': 'https://github.com/opto-sync/syncer.c.git',
                  'clients': 'https://github.com/opto-sync/opto-sync-clients.git',
              }
              for name, expected_url in expected_sources.items():
                  pin = source[name]
                  pin_path = safe_path(pin['path'])
                  assert pin_path.parts[0] == source['installRoot']
                  assert re.fullmatch(r'[0-9a-f]{40}', pin['commit'])

                  tree_entry = subprocess.check_output(
                      ['git', 'ls-tree', 'HEAD', '--', pin['path']], text=True
                  ).strip()
                  mode, object_type, commit_and_path = tree_entry.split(maxsplit=2)
                  commit, recorded_path = commit_and_path.split('\t', maxsplit=1)
                  assert (mode, object_type) == ('160000', 'commit')
                  assert recorded_path == pin['path'] and commit == pin['commit']

                  section = f'submodule "{pin["path"]}"'
                  assert modules.has_section(section)
                  assert modules.get(section, 'path') == pin['path']
                  assert modules.get(section, 'url') == expected_url

              adapter_root = source['clients']['path']
          else:
              # Registry-package mode is version-aware. A blocked adapter may
              # document a reviewed range while keeping manifest + lock
              # unresolved; once releaseState is publishable, both dependency
              # declaration and immutable lock evidence are mandatory.
              expected_range = profile['dependency']['range']
              assert re.fullmatch(r'\^[0-9]+\.[0-9]+\.[0-9]+', expected_range)
              assert manifest['install']['dir'] == 'zed_modules'
              assert profile['dependency'] == {
                  'package': dependency,
                  'range': expected_range,
                  'installRoot': 'zed_modules/opto-sync/opto-sync-clients',
              }
              if profile['releaseState'] == 'blocked-until-certified-package-published':
                  assert dependency not in manifest.get('dependencies', {})
                  assert f'opto-sync/opto-sync-clients@{expected_range}' in manifest_text
                  assert lock.get('version') == 1 and packages == []
              else:
                  assert manifest['dependencies'][dependency] == expected_range
                  package = next(
                      p for p in packages
                      if p.get('org') == 'opto-sync' and p.get('name') == 'opto-sync-clients'
                  )
                  assert re.fullmatch(r'[0-9a-f]{64}', package['sha256'])
                  assert re.fullmatch(r'[0-9a-f]{40}', package['vcs_commit'])
                  assert package['size'] > 0 and package['format'] and package['vcs_tag'] and package['source']
              adapter_root = profile['dependency']['installRoot']

          known = {
              'rust': ('opto-sync-client', 'clients/rust'),
              'typescript': ('@opto-sync/client', 'clients/ts'),
              'dart': ('opto_sync_client', 'clients/dart'),
              'gleam': ('opto_sync_client', 'clients/gleam'),
          }
          assert profile['nativeAdapters']
          for language, adapter in profile['nativeAdapters'].items():
              package, suffix = known[language]
              path = pathlib.PurePosixPath(adapter['path'])
              assert adapter['package'] == package
              assert not path.is_absolute() and '..' not in path.parts
              assert adapter['path'].startswith(adapter_root + '/')
              assert adapter['path'].endswith(suffix)

          persistence = profile['persistence']
          assert 'indexeddb' in persistence['web']
          assert {'postgres', 'supabase'} <= set(persistence['backend'])
          local = set(persistence.get('mobile', [])) | set(persistence.get('desktop', []))
          assert local & {'sqlite', 'drift'}

          retained = profile['wrapperRetains']
          delegated = profile['delegatesToOptoSync']
          assert retained and delegated and set(retained).isdisjoint(delegated)
          delegated_text = ' '.join(delegated).lower()
          for forbidden in ('access token', 'refresh token', 'api key', 'credential material'):
              assert forbidden not in delegated_text

          for invariant in (
              'renderLocalView', 'realtimeIsWakeHint', 'serverCursorIsAuthoritative',
              'mutableGitRefsForbidden', 'removeBespokeCoreOnlyAfterParity',
          ):
              assert profile['invariants'][invariant] is True

          serialized = json.dumps(profile).lower()
          for mutable in ('refs/heads/main', '"ref": "main"', '"ref": "latest"'):
              assert mutable not in serialized
          PY
