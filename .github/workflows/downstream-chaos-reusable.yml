name: reusable downstream opto-sync chaos

on:
  workflow_call:
    inputs:
      profile_path:
        description: Product profile in the caller repository
        required: false
        default: tests/opto-sync-wrapper/profile.json
        type: string
      chaos_test_path:
        description: Downstream chaos test in the caller repository
        required: false
        default: tests/opto-sync-wrapper/chaos.e2e.test.mjs
        type: string
      live_e2e:
        description: Run frozen package, native, real-browser, and downstream chaos tests
        required: false
        default: false
        type: boolean
      wrapper_ref:
        description: Optional wrapper branch, tag, or immutable commit override
        required: false
        default: ''
        type: string
    secrets:
      SYNC_FLEET_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: downstream-opto-chaos-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_SHA: c636fb8f6b08695c6b4fe94e2481f4d57270b2d7
  ZED_INTERFACES_SHA: dc0e0a0620b9462817950b552d3d334a184b1cb1

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sync_repository: ${{ steps.profile.outputs.sync_repository }}
      sync_ref: ${{ steps.profile.outputs.sync_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: profile
        name: Validate caller profile and chaos coverage
        shell: bash
        env:
          PROFILE_PATH: ${{ inputs.profile_path }}
          CHAOS_TEST_PATH: ${{ inputs.chaos_test_path }}
        run: |
          set -euo pipefail
          node --check "$CHAOS_TEST_PATH"
          python3 - <<'PY'
          import json, os, pathlib
          profile_path = pathlib.Path(os.environ['PROFILE_PATH'])
          suite_path = pathlib.Path(os.environ['CHAOS_TEST_PATH'])
          profile = json.loads(profile_path.read_text())
          suite = suite_path.read_text()
          assert profile['repository'] == os.environ['GITHUB_REPOSITORY']
          assert profile['syncRepository'] and profile['syncRef']
          assert profile['collections'] and profile['domainGuards']
          required = (
              'protocolPushRequest(', 'recordPushFailure(', 'clientId(',
              'pullCheckpoint(', 'localView(', 'QueueQuotaError',
              'queueDelete(', 'installSnapshot(', 'pendingMutations(',
              'reconcileIncoming(', 'indexedDB.deleteDatabase(',
          )
          assert all(token in suite for token in required)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"sync_repository={profile['syncRepository']}\n")
              output.write(f"sync_ref={profile['syncRef']}\n")
          PY

  live-chaos:
    needs: contract
    if: ${{ inputs.live_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SYNC_FLEET_TOKEN: ${{ secrets.SYNC_FLEET_TOKEN }}
      PROFILE_PATH: ${{ inputs.profile_path }}
      CHAOS_TEST_PATH: ${{ inputs.chaos_test_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require private fleet read credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SYNC_FLEET_TOKEN" || {
            echo 'SYNC_FLEET_TOKEN is required for cross-repository certification' >&2
            exit 1
          }
      - name: Resolve wrapper ref
        id: wrapper
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.wrapper_ref }}
          PROFILE_REF: ${{ needs.contract.outputs.sync_ref }}
        run: |
          set -euo pipefail
          ref="${REQUESTED_REF:-$PROFILE_REF}"
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.contract.outputs.sync_repository }}
          ref: ${{ steps.wrapper.outputs.ref }}
          path: wrapper
          token: ${{ secrets.SYNC_FLEET_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_SHA }}
          path: .tools/zed-cli
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: .tools/zed-interfaces
          persist-credentials: false
      - name: Build pinned Zed CLI
        run: cargo build --locked --release --manifest-path .tools/zed-cli/Cargo.toml --bin zed
      - name: Frozen-install and run native, browser, and downstream chaos tests
        shell: bash
        run: |
          set -euo pipefail
          zed="$GITHUB_WORKSPACE/.tools/zed-cli/target/release/zed"
          (cd wrapper && "$zed" install --frozen --install-mode copy)
          python3 - <<'PY'
          import pathlib, re, tomllib
          lock = tomllib.loads(pathlib.Path('wrapper/.zpkg.lock').read_text())
          package = next(
              p for p in lock.get('package', [])
              if p.get('org') == 'opto-sync' and p.get('name') == 'opto-sync-clients'
          )
          assert re.fullmatch(r'[0-9a-f]{64}', package['sha256'])
          assert package['size'] > 0 and package['format'] and package['vcs_tag'] and package['source']
          assert re.fullmatch(r'[0-9a-f]{40}', package['vcs_commit'])
          PY
          client="$GITHUB_WORKSPACE/wrapper/zed_modules/opto-sync/opto-sync-clients/clients/ts"
          cd "$client"
          npm ci
          npm run build
          npm run test:node
          npx playwright install --with-deps chromium
          OPTO_SYNC_REQUIRE_BROWSER=1 npm run test:browser
          cp "$GITHUB_WORKSPACE/$CHAOS_TEST_PATH" test/downstream-chaos.e2e.test.mjs
          OPTO_SYNC_PROFILE="$GITHUB_WORKSPACE/$PROFILE_PATH" \
            node --test test/downstream-chaos.e2e.test.mjs
