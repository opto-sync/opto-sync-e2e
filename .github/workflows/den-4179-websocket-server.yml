name: DEN-4179 websocket server guardrails

on:
  push:
    branches:
      - fix/den-4179-websocket-server-guardrails
    paths:
      - '.github/workflows/den-4179-websocket-server.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Patch server and integration contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          server = Path('servers/node/src/sync-transports.ts')
          source = server.read_text(encoding='utf-8')
          replacements = [
              (
                  'export const MAX_BROADCAST_BUFFERED_BYTES = 1024 * 1024;\n',
                  'export const MAX_BROADCAST_BUFFERED_BYTES = 1024 * 1024;\n'
                  '/** Bound concurrent async handlers retained by one WebSocket peer. */\n'
                  'export const MAX_WS_IN_FLIGHT_FRAMES = 32;\n',
              ),
              (
                  '''    hub.add(connection);\n    client.on("close", () => hub.remove(connection));\n    client.on("error", () => {\n      // `close` follows and cleans up; an errored peer must not crash us.\n    });\n    client.on("message", (data) => {\n      void routeFrame(data.toString(), handlers, (frame) => {\n        if (client.readyState === client.OPEN) client.send(JSON.stringify(frame));\n      });\n    });\n''',
                  '''    hub.add(connection);\n    let inFlightFrames = 0;\n    let terminal = false;\n    const retire = () => {\n      if (terminal) return;\n      terminal = true;\n      hub.remove(connection);\n    };\n    client.on("close", retire);\n    client.on("error", retire);\n    client.on("message", (data, isBinary) => {\n      if (terminal) return;\n      if (isBinary) {\n        retire();\n        client.close(1003, "text frames required");\n        return;\n      }\n      if (inFlightFrames >= MAX_WS_IN_FLIGHT_FRAMES) {\n        retire();\n        client.close(1013, "too many in-flight frames");\n        return;\n      }\n      inFlightFrames += 1;\n      void routeFrame(data.toString(), handlers, (frame) => {\n        if (client.readyState === client.OPEN) client.send(JSON.stringify(frame));\n      }).finally(() => {\n        inFlightFrames -= 1;\n      });\n    });\n''',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'server replacement expected once, found {count}')
              source = source.replace(old, new)
          server.write_text(source, encoding='utf-8')

          suite = Path('suite/protocol/ws-transport.mjs')
          source = suite.read_text(encoding='utf-8')
          replacements = [
              (
                  '''    const client = createFrameClient(\n      (text) => socket.send(text),\n      () => socket.close(),\n      label,\n    );\n    const timer = setTimeout(() => reject(new Error(`${label}: dial timed out`)), 10_000);\n''',
                  '''    const client = createFrameClient(\n      (text) => socket.send(text),\n      () => socket.close(),\n      label,\n    );\n    let resolveClosed;\n    client.closed = new Promise((resolveClose) => {\n      resolveClosed = resolveClose;\n    });\n    client.sendBinary = (bytes) => socket.send(bytes);\n    const timer = setTimeout(() => reject(new Error(`${label}: dial timed out`)), 10_000);\n''',
              ),
              (
                  '''    socket.addEventListener("close", () => client.fail(new Error(`${label} closed`)));\n''',
                  '''    socket.addEventListener("close", (event) => {\n      resolveClosed({ code: event.code, reason: event.reason });\n      client.fail(new Error(`${label} closed`));\n    });\n''',
              ),
              (
                  '''const wsA = await connectWs(wsUrl, "ws-a");\nconst wsB = await connectWs(wsUrl, "ws-b");\n\nawait transportParitySuite("websocket", wsA, wsB, "ws-tp");\n''',
                  '''const wsA = await connectWs(wsUrl, "ws-a");\nconst wsB = await connectWs(wsUrl, "ws-b");\n\nawait test("websocket rejects binary frames and keeps the server healthy", async () => {\n  const binary = await connectWs(wsUrl, "ws-binary");\n  binary.sendBinary(new Uint8Array([1, 2, 3]));\n  const closed = await Promise.race([\n    binary.closed,\n    sleep(5_000).then(() => {\n      throw new Error("binary websocket was not closed");\n    }),\n  ]);\n  equal(closed.code, 1003);\n  const health = await request("GET", "/health");\n  equal(health.status, 200);\n});\n\nawait transportParitySuite("websocket", wsA, wsB, "ws-tp");\n''',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'suite replacement expected once, found {count}')
              source = source.replace(old, new)
          suite.write_text(source, encoding='utf-8')
          PY

          git rm .github/workflows/den-4179-websocket-server.yml
          git add -- servers/node/src/sync-transports.ts suite/protocol/ws-transport.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'harden-websocket-server-guardrails'
          git push origin "HEAD:${GITHUB_REF_NAME}"
