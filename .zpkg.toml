[package]
org = "opto-sync"
name = "opto-sync-e2e"
version = "0.1.0"
description = "Cross-runtime and client-in-the-loop conformance harness for opto-sync"
license = "MIT"
keywords = ["sync", "conformance", "e2e", "postgres", "supabase", "docker"]

[package.repository]
vcs = "git"
url = "https://github.com/opto-sync/opto-sync-e2e"

[dependencies]
"opto-sync/syncer" = "^0.2.1"
"opto-sync/opto-sync-clients" = "^0.2.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".zed/**", ".zed-pack/**", ".env", "**/*.log"]
smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/LICENSE\" && test -f \"$ZED_PKG_TEST_TARGET/docker-compose.yml\" && test -f \"$ZED_PKG_TEST_TARGET/test/run_e2e.sh\" && test -f \"$ZED_PKG_TEST_TARGET/test/clients/run_all.sh\""

[scripts]
test = "test -f .env || cp .env.example .env; docker compose config --quiet"
